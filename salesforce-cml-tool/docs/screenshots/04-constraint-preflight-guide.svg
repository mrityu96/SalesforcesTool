  <rect x="293" y="790" width="565" height="68" rx="14" fill="#fff2ed" stroke="#ee9b79"/><text x="315" y="817" class="call">2. Expand the reason to see every missing dependency</text><text x="315" y="840" class="sub">Copy visible rows to Excel for the catalog deployment team.</text><path d="M610 790C650 690 690 560 705 511" fill="none" stroke="#e65f40" stroke-width="3" marker-end="url(#a)"/>
