<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f7ff"/><stop offset="1" stop-color="#eefcf8"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6558e8"/><stop offset="1" stop-color="#13a89e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ef6c45"/></marker>
    <style>
      .ui{font-family:Inter,Arial,sans-serif;fill:#1c2742}.muted{fill:#71809d}.small{font-size:14px}.label{font-size:13px;font-weight:700;fill:#52617c}.title{font-size:25px;font-weight:800}.nav{font-size:16px;font-weight:650}.btn{font-size:15px;font-weight:750;fill:white}.code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:14px;fill:#34415e}.call{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:750;fill:#6e2e1b}.callsub{font-family:Inter,Arial,sans-serif;font-size:14px;fill:#744638}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="42" y="35" width="1516" height="820" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="42" y="35" width="245" height="820" rx="24" fill="#111a33"/>
  <text x="76" y="86" font-family="Inter,Arial" font-size="22" font-weight="850" fill="white">CML Studio</text>
  <text x="76" y="112" font-family="Inter,Arial" font-size="12" fill="#99a8c8">SALESFORCE REVENUE CLOUD</text>
  <rect x="62" y="153" width="205" height="48" rx="12" fill="#6658e8"/><text x="87" y="183" class="nav" fill="white">v  Fetch &amp; Deploy</text>
  <text x="87" y="241" class="nav" fill="#aeb9d1">&lt;-&gt;  Compare</text>
  <text x="87" y="294" class="nav" fill="#aeb9d1">OK  Best Practices</text>
  <text x="87" y="347" class="nav" fill="#aeb9d1">#  Constraint Data</text>
  <text x="76" y="814" font-family="Inter,Arial" font-size="13" fill="#8f9dbc">Made with =&lt;3 by Mritunjaya Pancholi</text>

  <rect x="287" y="35" width="1271" height="75" rx="24" fill="#fff"/>
  <text x="330" y="74" class="ui title">Fetch &amp; Deploy</text>
  <text x="330" y="96" class="ui muted small">Select a model, fetch editable CML, then deploy to an authorized org.</text>
  <rect x="1416" y="56" width="103" height="34" rx="17" fill="#f0f3fa"/><text x="1438" y="78" class="ui small">Night mode</text>

  <text x="330" y="146" class="ui label">SOURCE ORG</text>
  <rect x="330" y="157" width="275" height="48" rx="10" fill="#f7f9fd" stroke="#cfd7e6"/>
  <circle cx="353" cy="181" r="6" fill="#27b58a"/><text x="370" y="187" class="ui" font-size="16">tigerDev</text><text x="578" y="187" class="ui">v</text>
  <text x="629" y="146" class="ui label">TARGET ORG</text>
  <rect x="629" y="157" width="275" height="48" rx="10" fill="#f7f9fd" stroke="#cfd7e6"/>
  <circle cx="652" cy="181" r="6" fill="#4f8ee9"/><text x="669" y="187" class="ui" font-size="16">migDev</text><text x="877" y="187" class="ui">v</text>
  <text x="928" y="146" class="ui label">CONSTRAINT MODEL</text>
  <rect x="928" y="157" width="425" height="48" rx="10" fill="#eef0ff" stroke="#766ae9" stroke-width="2"/>
  <text x="950" y="179" class="ui" font-size="15" font-weight="750">PCM_Constraint_Model</text><text x="950" y="196" class="muted small">V1  |  Active  |  selected</text>
  <rect x="1367" y="157" width="150" height="48" rx="10" fill="#fff" stroke="#cfd7e6"/><text x="1395" y="187" class="ui" font-size="14" font-weight="700">Change CML</text>

  <rect x="330" y="238" width="1187" height="514" rx="16" fill="#fff" stroke="#dbe1ec"/>
  <text x="358" y="277" class="ui title" font-size="21">CML Editor</text>
  <text x="358" y="299" class="ui muted small">Fetched from tigerDev  |  PCM_Constraint_Model V1</text>
  <rect x="1230" y="257" width="155" height="36" rx="9" fill="#fff" stroke="#ccd5e5"/><text x="1249" y="280" class="ui small" font-weight="700">Check best practices</text>
  <rect x="1397" y="257" width="88" height="36" rx="9" fill="#fff" stroke="#ccd5e5"/><text x="1421" y="280" class="ui small" font-weight="700">Copy</text>
  <rect x="358" y="320" width="1127" height="336" rx="11" fill="#10182d"/>
  <rect x="358" y="320" width="48" height="336" rx="11" fill="#18223b"/>
  <text x="377" y="354" class="code" fill="#7183a5">1</text><text x="424" y="354" class="code" fill="#b9c5e1">type LineItem {</text>
  <text x="377" y="382" class="code" fill="#7183a5">2</text><text x="446" y="382" class="code" fill="#75d7c8">relation</text><text x="513" y="382" class="code" fill="#dce5fa"> product : ProductClassification;</text>
  <text x="377" y="410" class="code" fill="#7183a5">3</text><text x="446" y="410" class="code" fill="#75d7c8">string</text><text x="498" y="410" class="code" fill="#dce5fa"> ActionType;</text>
  <text x="377" y="438" class="code" fill="#7183a5">4</text><text x="424" y="438" class="code" fill="#b9c5e1">}</text>
  <text x="377" y="482" class="code" fill="#7183a5">6</text><text x="424" y="482" class="code" fill="#b9c5e1">type ProductClassification : LineItem;</text>
  <text x="377" y="526" class="code" fill="#7183a5">8</text><text x="424" y="526" class="code" fill="#b9c5e1">constraint(Product_guard) {</text>
  <text x="377" y="554" class="code" fill="#7183a5">9</text><text x="446" y="554" class="code" fill="#f1b66c">ActionType</text><text x="527" y="554" class="code" fill="#dce5fa"> != "Cancel"</text>
  <text x="377" y="582" class="code" fill="#7183a5">10</text><text x="424" y="582" class="code" fill="#b9c5e1">}</text>
  <rect x="358" y="680" width="138" height="48" rx="10" fill="#6558e8"/><text x="384" y="710" class="btn">Fetch CML</text>
  <text x="536" y="694" class="ui label">DEPLOY TO</text><rect x="536" y="702" width="190" height="42" rx="9" fill="#f7f9fd" stroke="#ccd5e5"/><text x="558" y="728" class="ui">migDev  v</text>
  <rect x="740" y="696" width="145" height="48" rx="10" fill="#14a77d"/><text x="766" y="726" class="btn">Deploy CML</text>
  <rect x="910" y="696" width="575" height="48" rx="10" fill="#eaf9f3"/><circle cx="934" cy="720" r="8" fill="#20aa7f"/><text x="953" y="725" class="ui small" fill="#20745f">Ready  -  388 lines loaded. Deployment requires confirmation.</text>

  <rect x="1110" y="116" width="410" height="76" rx="14" fill="#fff3ed" stroke="#f0a07d"/><text x="1130" y="143" class="call">1. Choose source, target, and model</text><text x="1130" y="166" class="callsub">The selected model collapses to avoid accidental changes.</text>
  <path d="M1110 154C1068 155 1040 169 1005 177" fill="none" stroke="#ef6c45" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1056" y="775" width="464" height="78" rx="14" fill="#fff3ed" stroke="#f0a07d"/><text x="1077" y="803" class="call">2. Fetch first, review, then choose Deploy to</text><text x="1077" y="827" class="callsub">Deploy overwrites the latest version only after confirmation.</text>
  <path d="M1056 801C982 790 898 748 820 725" fill="none" stroke="#ef6c45" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="72" y="410" width="245" height="95" rx="14" fill="#fff3ed" stroke="#f0a07d"/><text x="92" y="438" class="call">3. Edit safely</text><text x="92" y="462" class="callsub">The editor shows the exact CML</text><text x="92" y="484" class="callsub">that will be deployed.</text>
  <path d="M317 454L390 454" fill="none" stroke="#ef6c45" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
