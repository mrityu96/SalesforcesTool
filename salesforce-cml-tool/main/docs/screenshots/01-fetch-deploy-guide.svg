<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f7ff"/><stop offset="1" stop-color="#eefcf8"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6558e8"/><stop offset="1" stop-color="#13a89e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#2463eb"/></marker>
    <style>
      .ui{font-family:Inter,Arial,sans-serif;fill:#1c2742}.muted{fill:#71809d}.small{font-size:14px}.label{font-size:13px;font-weight:700;fill:#52617c}.title{font-size:25px;font-weight:800}.nav{font-size:16px;font-weight:650}.btn{font-size:15px;font-weight:750;fill:white}.code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:14px;fill:#34415e}.call{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:800;fill:#173f9b}.callsub{font-family:Inter,Arial,sans-serif;font-size:14px;fill:#315aa9}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="42" y="35" width="1516" height="820" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="42" y="35" width="245" height="820" rx="24" fill="#111a33"/>
  <text x="76" y="86" font-family="Inter,Arial" font-size="22" font-weight="850" fill="white">CML Studio</text>
  <text x="76" y="112" font-family="Inter,Arial" font-size="12" fill="#99a8c8">SALESFORCE REVENUE CLOUD</text>
  <rect x="62" y="153" width="205" height="48" rx="12" fill="#6658e8"/><text x="87" y="183" class="nav" fill="white">v  Fetch &amp; Deploy</text>
  <text x="87" y="241" class="nav" fill="#aeb9d1">&lt;-&gt;  Compare</text>
  <text x="87" y="294" class="nav" fill="#aeb9d1">OK  Best Practices</text>
  <text x="87" y="347" class="nav" fill="#aeb9d1">#  Constraint Data</text>
  <text x="87" y="400" font-family="Inter,Arial" font-size="16" fill="#aeb9d1">?  Guide Me on Tool</text>
  <text x="76" y="814" font-family="Inter,Arial" font-size="13" fill="#8f9dbc">Made with =&lt;3 by Mritunjaya Pancholi</text>

  <rect x="287" y="35" width="1271" height="75" rx="24" fill="#fff"/>
  <text x="330" y="74" class="ui title">Fetch &amp; Deploy</text>
  <text x="330" y="96" class="ui muted small">Select a model, fetch editable CML, then deploy to an authorized org.</text>
  <rect x="1416" y="56" width="103" height="34" rx="17" fill="#f0f3fa"/><text x="1438" y="78" class="ui small">Night mode</text>

  <text x="330" y="126" class="ui label">SOURCE ORG</text>
  <rect x="330" y="133" width="570" height="36" rx="10" fill="#f7f9fd" stroke="#cfd7e6"/>
  <circle cx="353" cy="151" r="6" fill="#27b58a"/><text x="370" y="157" class="ui" font-size="15">tigerDev</text><text x="874" y="157" class="ui">v</text>
  <text x="928" y="126" class="ui label">TARGET ORG (COMPARE-WITH)</text>
  <rect x="928" y="133" width="589" height="36" rx="10" fill="#f7f9fd" stroke="#cfd7e6"/>
  <circle cx="951" cy="151" r="6" fill="#4f8ee9"/><text x="968" y="157" class="ui" font-size="15">migDev</text><text x="1491" y="157" class="ui">v</text>
  <text x="330" y="187" class="ui label">SOURCE CML EXACT VERSION</text>
  <rect x="330" y="194" width="570" height="36" rx="10" fill="#eef0ff" stroke="#766ae9" stroke-width="2"/>
  <text x="350" y="217" class="ui" font-size="14" font-weight="750">PCM_Constraint_Model · V1 · Source Runtime: Active</text>
