<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7ff"/><stop offset="1" stop-color="#edfdf6"/></linearGradient>
    <filter id="s"><feDropShadow dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#e66142"/></marker>
    <style>.ui{font-family:Inter,Arial;fill:#1d2945}.h{font-size:25px;font-weight:800}.muted{fill:#70809b}.sm{font-size:13px}.b{font-size:15px;font-weight:750}.code{font-family:ui-monospace,monospace;font-size:13px}.call{font-family:Inter,Arial;font-size:17px;font-weight:800;fill:#71301f}.sub{font-family:Inter,Arial;font-size:14px;fill:#754739}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect x="40" y="34" width="1520" height="824" rx="24" fill="white" filter="url(#s)"/>
  <rect x="40" y="34" width="235" height="824" rx="24" fill="#111a33"/><text x="72" y="83" font-family="Inter,Arial" font-size="22" font-weight="850" fill="white">CML Studio</text>
  <text x="80" y="170" font-family="Inter,Arial" font-size="16" fill="#aeb9d1">v  Fetch &amp; Deploy</text><text x="80" y="223" font-family="Inter,Arial" font-size="16" fill="#aeb9d1">&lt;-&gt;  Compare</text>
  <rect x="58" y="252" width="198" height="48" rx="12" fill="#16a77c"/><text x="80" y="282" font-family="Inter,Arial" font-size="16" font-weight="700" fill="white">OK  Best Practices</text><text x="80" y="347" font-family="Inter,Arial" font-size="16" fill="#aeb9d1">#  Constraint Data</text>
    <text x="78" y="400" font-family="Inter,Arial" font-size="16" fill="#aeb9d1">?  Guide Me on Tool</text>
<text x="315" y="76" class="ui h">Best Practices</text><text x="315" y="99" class="ui muted" font-size="14">Plain-English findings with supported, paste-ready CML corrections.</text>
  <rect x="315" y="130" width="1205" height="92" rx="15" fill="#f7f9fd" stroke="#d9e1ed"/>
  <text x="342" y="158" class="ui sm" font-weight="700">QUALITY SCORE</text><text x="342" y="198" class="ui" font-size="34" font-weight="850" fill="#d2762b">72</text><text x="393" y="198" class="ui muted" font-size="18">/ 100</text>
  <rect x="510" y="153" width="118" height="35" rx="17" fill="#fde9e7"/><text x="536" y="176" class="ui sm" font-weight="750" fill="#a9473e">2 errors</text>
  <rect x="640" y="153" width="130" height="35" rx="17" fill="#fff2db"/><text x="663" y="176" class="ui sm" font-weight="750" fill="#9a681d">4 warnings</text>
  <rect x="782" y="153" width="142" height="35" rx="17" fill="#e8f1ff"/><text x="805" y="176" class="ui sm" font-weight="750" fill="#356aa9">3 suggestions</text>
  <rect x="1260" y="151" width="225" height="48" rx="10" fill="#17a77d"/><text x="1292" y="181" font-family="Inter,Arial" font-size="15" font-weight="760" fill="white">Check best practices</text>

  <rect x="315" y="243" width="1205" height="190" rx="14" fill="#fff" stroke="#e1b5ab" stroke-width="2"/>
  <rect x="315" y="243" width="9" height="190" rx="4" fill="#dc604b"/><text x="346" y="276" class="ui sm" font-weight="800" fill="#b34a3a">AP-9  |  WARNING  |  LINE 44</text>
  <text x="346" y="309" class="ui" font-size="18" font-weight="780">Relation 'modem' does not say how many items are allowed.</text>
  <text x="346" y="337" class="ui muted" font-size="14">Without cardinality, another developer cannot tell whether the modem is optional, required, or repeatable.</text>
  <rect x="346" y="359" width="520" height="50" rx="9" fill="#fff0ee"/><text x="365" y="389" class="code" fill="#a7483b">Before  relation modem : Modem;</text>
  <rect x="884" y="359" width="586" height="50" rx="9" fill="#eaf9f3"/><text x="903" y="389" class="code" fill="#18755c">After   relation modem : Modem[1..1];</text><rect x="1382" y="369" width="70" height="30" rx="8" fill="#fff" stroke="#8cccb8"/><text x="1401" y="389" class="ui sm" font-weight="750">Copy</text>

  <rect x="315" y="453" width="1205" height="220" rx="14" fill="#fff" stroke="#e4d0a6" stroke-width="2"/>
  <rect x="315" y="453" width="9" height="220" rx="4" fill="#df9d32"/><text x="346" y="486" class="ui sm" font-weight="800" fill="#97651f">AP-4  |  WARNING  |  REPEATED 14 TIMES</text>
  <text x="346" y="519" class="ui" font-size="18" font-weight="780">The same list of allowed values is copied into many attributes.</text>
  <text x="346" y="547" class="ui muted" font-size="14">Create the list once, give it a clear name, and reuse it. Updating one shared list prevents inconsistent values.</text>
  <rect x="346" y="570" width="520" height="78" rx="9" fill="#fff8e9"/><text x="365" y="598" class="code" fill="#97651f">Before</text><text x="365" y="625" class="code" fill="#6f552b">string PurchaseTerm = ["24", "Month-to-Month"];</text>
  <rect x="884" y="570" width="586" height="78" rx="9" fill="#eaf9f3"/><text x="903" y="598" class="code" fill="#18755c">After</text><text x="903" y="625" class="code" fill="#226f5d">define[] PurchaseTerms = ["24", "Month-to-Month"];</text>

  <rect x="315" y="693" width="1205" height="65" rx="12" fill="#eaf2ff"/><text x="340" y="720" class="ui b" fill="#356ca8">9 Suggestions do not lower the score.</text><text x="340" y="744" class="ui sm" fill="#5278a3">Errors and warnings use capped penalties so one repeated issue cannot reduce the score to zero.</text>

  <rect x="1050" y="782" width="470" height="72" rx="14" fill="#fff2ed" stroke="#ee9b79"/><text x="1072" y="809" class="call">3. Copy a supported correction</text><text x="1072" y="833" class="sub">Review the meaning first; then paste the 'After' CML.</text><path d="M1240 782C1288 712 1385 482 1415 400" fill="none" stroke="#e66142" stroke-width="3" marker-end="url(#a)"/>
  <rect x="294" y="782" width="485" height="72" rx="14" fill="#fff2ed" stroke="#ee9b79"/><text x="316" y="809" class="call">2. Click the line number to jump to the editor</text><text x="316" y="833" class="sub">Every message explains what is wrong and why it matters.</text><path d="M520 782C490 677 420 381 374 280" fill="none" stroke="#e66142" stroke-width="3" marker-end="url(#a)"/>
  <rect x="1030" y="54" width="465" height="64" rx="14" fill="#fff2ed" stroke="#ee9b79"/><text x="1052" y="80" class="call">1. Score is guidance - not deployment validation</text><text x="1052" y="103" class="sub">Use it to improve readability and maintainability.</text><path d="M1105 118C1000 144 730 169 420 178" fill="none" stroke="#e66142" stroke-width="3" marker-end="url(#a)"/>
</svg>
