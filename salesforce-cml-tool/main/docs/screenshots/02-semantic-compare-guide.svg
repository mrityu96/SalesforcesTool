<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7ff"/><stop offset="1" stop-color="#f2fbff"/></linearGradient>
    <filter id="s"><feDropShadow dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#e85d3d"/></marker>
    <style>.ui{font-family:Inter,Arial,sans-serif;fill:#1d2945}.muted{fill:#71809b}.h{font-size:25px;font-weight:800}.b{font-size:15px;font-weight:750}.sm{font-size:13px}.code{font-family:ui-monospace,monospace;font-size:13px}.call{font-family:Inter,Arial;font-size:17px;font-weight:800;fill:#71301f}.sub{font-family:Inter,Arial;font-size:14px;fill:#754739}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect x="38" y="34" width="1524" height="824" rx="24" fill="white" filter="url(#s)"/>
  <rect x="38" y="34" width="235" height="824" rx="24" fill="#111a33"/>
  <text x="70" y="84" font-family="Inter,Arial" font-size="22" font-weight="850" fill="white">CML Studio</text>
  <text x="78" y="173" font-family="Inter,Arial" font-size="16" fill="#aeb9d1">v  Fetch &amp; Deploy</text>
  <rect x="56" y="205" width="198" height="48" rx="12" fill="#6558e8"/><text x="78" y="235" font-family="Inter,Arial" font-size="16" font-weight="700" fill="white">&lt;-&gt;  Compare</text>
  <text x="78" y="297" font-family="Inter,Arial" font-size="16" fill="#aeb9d1">OK  Best Practices</text><text x="78" y="350" font-family="Inter,Arial" font-size="16" fill="#aeb9d1">#  Constraint Data</text>
    <text x="78" y="400" font-family="Inter,Arial" font-size="16" fill="#aeb9d1">?  Guide Me on Tool</text>
<text x="315" y="76" class="ui h">Compare CML</text><text x="315" y="99" class="ui muted" font-size="14">Find exact text changes or compare the model by meaning.</text>
  <rect x="315" y="130" width="1205" height="85" rx="15" fill="#f7f9fd" stroke="#d9e0ec"/>
  <text x="340" y="158" class="ui sm" font-weight="700">SOURCE</text><text x="340" y="186" class="ui b">tigerDev</text>
  <text x="535" y="158" class="ui sm" font-weight="700">TARGET</text><text x="535" y="186" class="ui b">migDev</text>
  <text x="725" y="158" class="ui sm" font-weight="700">MODEL</text><text x="725" y="186" class="ui b">PCM_Constraint_Model</text>
  <rect x="1236" y="150" width="250" height="46" rx="10" fill="#6c55dc"/><text x="1267" y="179" font-family="Inter,Arial" font-size="15" font-weight="760" fill="white">Compare source &lt;-&gt; target</text>
  <rect x="315" y="235" width="1205" height="54" rx="12" fill="#f6f7fb" stroke="#dbe1eb"/>
  <rect x="340" y="252" width="17" height="17" rx="3" fill="white" stroke="#9ba8bc"/><text x="368" y="266" class="ui sm">Show only differences</text>
  <rect x="524" y="252" width="17" height="17" rx="3" fill="#6558e8"/><path d="M528 260l4 4 7-9" fill="none" stroke="white" stroke-width="2"/>
  <text x="552" y="266" class="ui sm" font-weight="750">Semantic summary</text>
  <text x="690" y="266" class="ui muted sm">Overlays structural findings and makes merge arrows operate on complete entities.</text>
  <rect x="315" y="306" width="1205" height="48" rx="10" fill="#eaf9f4"/><circle cx="340" cy="330" r="8" fill="#19a77c"/>
  <text x="359" y="335" class="ui b" fill="#18745d">Semantic: 0 added  |  0 removed  |  1 modified  |  1 moved  |  0 ambiguous</text>

  <rect x="315" y="374" width="588" height="398" rx="14" fill="#121a2f"/><rect x="932" y="374" width="588" height="398" rx="14" fill="#121a2f"/>
  <text x="339" y="405" font-family="Inter,Arial" font-size="14" font-weight="750" fill="#f1f4fb">SOURCE  |  tigerDev</text>
  <text x="956" y="405" font-family="Inter,Arial" font-size="14" font-weight="750" fill="#f1f4fb">TARGET DRAFT  |  migDev</text>
  <rect x="1430" y="386" width="62" height="25" rx="6" fill="#26324c" stroke="#61708d"/><text x="1444" y="403" font-family="Inter,Arial" font-size="11" font-weight="700" fill="#dbe7fa">Copy</text>
  <rect x="332" y="425" width="554" height="80" rx="8" fill="#2c2545"/><rect x="949" y="425" width="554" height="80" rx="8" fill="#2c2545"/>
  <text x="346" y="452" class="code" fill="#ffbd8b">MODIFIED  type InternetPlan : LineItem {</text><text x="362" y="480" class="code" fill="#ffbd8b">relation modem : Modem[1..1];</text>
  <text x="963" y="452" class="code" fill="#9ec5ff">MODIFIED  type InternetPlan : LineItem {</text><text x="979" y="480" class="code" fill="#9ec5ff">relation modem : Modem[0..1];</text>
  <rect x="906" y="447" width="23" height="23" rx="6" fill="#6558e8"/><text x="913" y="464" font-family="Inter,Arial" font-size="15" font-weight="800" fill="white">→</text>
  <rect x="332" y="520" width="554" height="108" rx="8" fill="#173247"/><rect x="949" y="520" width="554" height="108" rx="8" fill="#173247"/>
  <text x="346" y="548" class="code" fill="#8ed9d0">Complete entity merge</text><text x="346" y="576" class="code" fill="#dbe7fa">Copies all lines in InternetPlan</text><text x="346" y="604" class="code" fill="#ffbd8b">Salesforce remains unchanged</text>
  <text x="963" y="548" class="code" fill="#8ed9d0">Target working draft</text><text x="963" y="576" class="code" fill="#dbe7fa">Reanalyzed after every arrow</text><text x="963" y="604" class="code" fill="#9ec5ff">Review before guarded deploy</text>
  <rect x="332" y="644" width="554" height="92" rx="8" fill="#18233b"/><rect x="949" y="644" width="554" height="92" rx="8" fill="#18233b"/>
  <text x="350" y="674" class="code" fill="#91a2c2">MOVED  type StarterTV : LineItem;</text>
  <text x="350" y="702" class="code" fill="#7ed6bd">Same semantic identity at a different line.</text>
  <text x="967" y="674" class="code" fill="#91a2c2">MOVED  type StarterTV : LineItem;</text>
  <text x="967" y="702" class="code" fill="#7ed6bd">Source and target panes remain visible.</text>

  <rect x="1070" y="793" width="450" height="72" rx="14" fill="#fff2ed" stroke="#ee9b79"/><text x="1090" y="820" class="call">3. Merge complete entities into the draft</text><text x="1090" y="844" class="sub">Ambiguous identities are shown but receive no merge arrow.</text>
  <path d="M1116 793C1098 748 1050 625 1042 582" fill="none" stroke="#e85d3d" stroke-width="3" marker-end="url(#a)"/>
  <rect x="282" y="793" width="410" height="72" rx="14" fill="#fff2ed" stroke="#ee9b79"/><text x="302" y="820" class="call">2. Turn on Semantic summary for overlays</text><text x="302" y="844" class="sub">Leave it off to use raw line-hunk merge arrows.</text>
  <path d="M495 793C500 689 521 362 531 270" fill="none" stroke="#e85d3d" stroke-width="3" marker-end="url(#a)"/>
  <rect x="1045" y="55" width="465" height="65" rx="14" fill="#fff2ed" stroke="#ee9b79"/><text x="1066" y="82" class="call">1. Compare two different authorized orgs</text><text x="1066" y="105" class="sub">The source is always left; the target is always right.</text>
  <path d="M1200 120L1200 151" stroke="#e85d3d" stroke-width="3" marker-end="url(#a)"/>
</svg>
