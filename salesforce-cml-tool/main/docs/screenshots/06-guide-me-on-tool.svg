<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Guide Me on Tool walkthrough</title>
  <desc id="desc">Annotated synthetic view of the eight-step safe workflow and read/write labels.</desc>
  <rect width="1440" height="900" fill="#f4f7fb"/>
  <rect x="36" y="34" width="1368" height="832" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="36" y="34" width="250" height="832" rx="24" fill="#13213a"/>
  <text x="70" y="92" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Salesforce CML Tool</text>
  <g font-family="Arial,sans-serif" font-size="17" fill="#cbd5e1">
    <text x="70" y="168">Fetch &amp; Deploy</text><text x="70" y="220">Compare</text>
    <text x="70" y="272">Best Practices</text><text x="70" y="324">Constraint Data Deploy</text>
  </g>
  <rect x="54" y="352" width="214" height="52" rx="12" fill="#2563eb"/>
  <text x="70" y="385" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Guide Me on Tool</text>
  <text x="330" y="88" fill="#64748b" font-family="Arial,sans-serif" font-size="14" font-weight="700">SAFE OPERATING WORKFLOW</text>
  <text x="330" y="126" fill="#0f172a" font-family="Arial,sans-serif" font-size="30" font-weight="700">Guide Me on Tool</text>
  <rect x="1090" y="82" width="112" height="34" rx="17" fill="#dcfce7" stroke="#15803d"/>
  <text x="1111" y="104" fill="#166534" font-family="Arial,sans-serif" font-size="13" font-weight="700">Read-only</text>
  <rect x="1216" y="82" width="150" height="34" rx="17" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="1233" y="104" fill="#991b1b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Writes Salesforce</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(330 170)"><rect width="490" height="118" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="40" cy="42" r="23" fill="#2563eb"/><text x="34" y="49" fill="#fff" font-size="19" font-weight="700">1</text><text x="78" y="37" fill="#0f172a" font-size="17" font-weight="700">Choose source org + exact version</text><text x="78" y="65" fill="#166534" font-size="12" font-weight="700">READ-ONLY</text><text x="78" y="91" fill="#475569" font-size="13">Confirm the intended source, not merely the newest.</text></g>
    <g transform="translate(850 170)"><rect width="490" height="118" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="40" cy="42" r="23" fill="#2563eb"/><text x="34" y="49" fill="#fff" font-size="19" font-weight="700">2</text><text x="78" y="37" fill="#0f172a" font-size="17" font-weight="700">Fetch CML</text><text x="78" y="65" fill="#166534" font-size="12" font-weight="700">READ-ONLY</text><text x="78" y="91" fill="#475569" font-size="13">Load the selected CML into the local editor.</text></g>
    <g transform="translate(330 310)"><rect width="490" height="118" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="40" cy="42" r="23" fill="#7c3aed"/><text x="34" y="49" fill="#fff" font-size="19" font-weight="700">3</text><text x="78" y="37" fill="#0f172a" font-size="17" font-weight="700">Compare and prepare merge draft</text><text x="78" y="65" fill="#166534" font-size="12" font-weight="700">READ-ONLY</text><text x="78" y="91" fill="#475569" font-size="13">Use exact versions and optional semantic overlays.</text></g>
    <g transform="translate(850 310)"><rect width="490" height="118" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="40" cy="42" r="23" fill="#7c3aed"/><text x="34" y="49" fill="#fff" font-size="19" font-weight="700">4</text><text x="78" y="37" fill="#0f172a" font-size="17" font-weight="700">Check best practices</text><text x="78" y="65" fill="#166534" font-size="12" font-weight="700">READ-ONLY</text><text x="78" y="91" fill="#475569" font-size="13">Review and resolve findings before deployment.</text></g>
    <g transform="translate(330 450)"><rect width="490" height="118" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="40" cy="42" r="23" fill="#0f766e"/><text x="34" y="49" fill="#fff" font-size="19" font-weight="700">5</text><text x="78" y="37" fill="#0f172a" font-size="17" font-weight="700">Choose target + review status</text><text x="78" y="65" fill="#166534" font-size="12" font-weight="700">READ-ONLY</text><text x="78" y="91" fill="#475569" font-size="13">Target status can differ between orgs.</text></g>
    <g transform="translate(850 450)"><rect width="490" height="118" rx="14" fill="#fff7f7" stroke="#fecaca"/><circle cx="40" cy="42" r="23" fill="#dc2626"/><text x="34" y="49" fill="#fff" font-size="19" font-weight="700">6</text><text x="78" y="37" fill="#0f172a" font-size="17" font-weight="700">Back up, confirm, then deploy</text><text x="78" y="65" fill="#991b1b" font-size="12" font-weight="700">WRITES SALESFORCE</text><text x="78" y="91" fill="#475569" font-size="13">Verify the exact destination before writing.</text></g>
    <g transform="translate(330 590)"><rect width="490" height="118" rx="14" fill="#fff7f7" stroke="#fecaca"/><circle cx="40" cy="42" r="23" fill="#dc2626"/><text x="34" y="49" fill="#fff" font-size="19" font-weight="700">7</text><text x="78" y="37" fill="#0f172a" font-size="17" font-weight="700">Constraint Data Deploy</text><text x="78" y="65" fill="#991b1b" font-size="12" font-weight="700">WRITES SALESFORCE</text><text x="78" y="91" fill="#475569" font-size="13">Complete dependency preflight before deploying.</text></g>
    <g transform="translate(850 590)"><rect width="490" height="118" rx="14" fill="#fff7f7" stroke="#fecaca"/><circle cx="40" cy="42" r="23" fill="#dc2626"/><text x="34" y="49" fill="#fff" font-size="19" font-weight="700">8</text><text x="78" y="37" fill="#0f172a" font-size="17" font-weight="700">Restore and recover</text><text x="78" y="65" fill="#991b1b" font-size="12" font-weight="700">WRITES SALESFORCE</text><text x="78" y="91" fill="#475569" font-size="13">Use saved backups and re-confirm the target.</text></g>
  </g>
  <rect x="330" y="738" width="1010" height="88" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="352" y="768" fill="#92400e" font-family="Arial,sans-serif" font-size="15" font-weight="700">BOUNDARY</text>
  <text x="352" y="795" fill="#78350f" font-family="Arial,sans-serif" font-size="13">No compile, activation, or runtime proof. Catalog prerequisites are read-only and fixed externally.</text>
</svg>
